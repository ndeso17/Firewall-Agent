name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Decode keystore base64 (optional — jika TIDAK ada, release unsigned)
      - name: Decode keystore
        id: keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore
            echo "ks_available=true" >> $GITHUB_OUTPUT
          else
            echo "ks_available=false" >> $GITHUB_OUTPUT
          fi

      - name: Build debug APK (fallback)
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build publik release
        working-directory: android-app
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.ks_available == 'true' && '/tmp/release.keystore' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assemblePublikRelease

      - name: Build privat release
        working-directory: android-app
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.ks_available == 'true' && '/tmp/release.keystore' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assemblePrivatRelease

      - name: Prepare release assets
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p release-assets

          # Publik release (atau debug fallback jika release gagal)
          if [ -f android-app/app/build/outputs/apk/publik/release/app-publik-release.apk ]; then
            cp android-app/app/build/outputs/apk/publik/release/app-publik-release.apk \
              "release-assets/FirewallAgent-${TAG}-publik.apk"
          fi
          if [ -f android-app/app/build/outputs/apk/privat/release/app-privat-release.apk ]; then
            cp android-app/app/build/outputs/apk/privat/release/app-privat-release.apk \
              "release-assets/FirewallAgent-${TAG}-privat.apk"
          fi
          # Debug selalu ada
          cp android-app/app/build/outputs/apk/debug/app-debug.apk \
            "release-assets/FirewallAgent-${TAG}-debug.apk" 2>/dev/null || true

          # Module Magisk (exclude runtime)
          cd module
          zip -r "../release-assets/FirewallAgent-${TAG}-magisk.zip" . \
            -x "runtime/*" "runtime/**" "*.DS_Store"
          cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true