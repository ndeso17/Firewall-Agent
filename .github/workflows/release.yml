name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Decode keystore base64 (optional — jika TIDAK ada, release pakai debug signing)
      - name: Decode keystore
        id: keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore
            echo "ks_available=true" >> $GITHUB_OUTPUT
          else
            echo "ks_available=false" >> $GITHUB_OUTPUT
          fi

      - name: Build publik debug
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew assemblePublikDebug

      - name: Build publik release
        working-directory: android-app
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.ks_available == 'true' && '/tmp/release.keystore' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assemblePublikRelease

      - name: Prepare release assets
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p release-assets

          cp android-app/app/build/outputs/apk/publik/release/app-publik-release.apk \
            "release-assets/FirewallAgent-${TAG}-publik.apk" 2>/dev/null || true

          cp android-app/app/build/outputs/apk/publik/debug/app-publik-debug.apk \
            "release-assets/FirewallAgent-${TAG}-debug.apk" 2>/dev/null || true

          # Module Magisk (exclude runtime)
          cd module
          zip -r "../release-assets/FirewallAgent-${TAG}-magisk.zip" . \
            -x "runtime/*" "runtime/**" "*.DS_Store"
          cd ..

      - name: Upload artifacts (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: firewall-agent-build
          path: release-assets/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
