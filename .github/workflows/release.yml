name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode keystore
        id: keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore
            echo "ks_available=true" >> $GITHUB_OUTPUT
          else
            echo "ks_available=false" >> $GITHUB_OUTPUT
          fi

      - name: Build publik debug
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew assemblePublikDebug

      - name: Build publik release
        working-directory: android-app
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.ks_available == 'true' && '/tmp/release.keystore' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assemblePublikRelease

      - name: Locate APKs
        run: |
          echo "=== APK files ==="
          find android-app/app/build/outputs/apk -name "*.apk" -type f 2>/dev/null || echo "no apk dir"

      - name: Prepare release assets
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p release-assets

          REL_APK=$(find android-app/app/build/outputs/apk/publik/release -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -n "$REL_APK" ]; then
            cp "$REL_APK" "release-assets/FirewallAgent-${TAG}-publik.apk"
          fi

          DBG_APK=$(find android-app/app/build/outputs/apk/publik/debug -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -n "$DBG_APK" ]; then
            cp "$DBG_APK" "release-assets/FirewallAgent-${TAG}-debug.apk"
          fi

          cd module
          zip -r "../release-assets/FirewallAgent-${TAG}-magisk.zip" . \
            -x "runtime/*" "runtime/**" "*.DS_Store"
          cd ..

      - name: Verify assets
        run: ls -lh release-assets/

      - name: Upload publik APK (manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: FirewallAgent-${{ github.ref_name }}-publik
          path: release-assets/FirewallAgent-${{ github.ref_name }}-publik.apk

      - name: Upload debug APK (manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: FirewallAgent-${{ github.ref_name }}-debug
          path: release-assets/FirewallAgent-${{ github.ref_name }}-debug.apk

      - name: Upload magisk module (manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: FirewallAgent-${{ github.ref_name }}-magisk
          path: release-assets/FirewallAgent-${{ github.ref_name }}-magisk.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
